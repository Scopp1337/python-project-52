{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-dark">
        <i class="bi bi-pencil-square"></i> Изменение задачи
    </h1>

    <div class="card shadow-sm border-secondary">
        <div class="card-header bg-primary text-white">
            <h2 class="card-title h4 mb-0">
                <i class="bi bi-check-circle-fill"></i> {{ task.name }}
            </h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <!-- Поле Имя -->
                <div class="mb-4 p-3 bg-light rounded">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-pencil-square fs-4 text-primary me-2"></i>
                        <label for="id_name" class="fw-bold text-dark mb-0">Имя</label>
                    </div>
                    <input type="text" name="name" id="id_name" class="form-control"
                           value="{{ task.name }}" required>
                    {% if form.name.errors %}
                        <div class="text-danger mt-2">
                            {% for error in form.name.errors %}
                                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <!-- Поле Описание -->
                <div class="mb-4 p-3 bg-light rounded">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-chat-text fs-4 text-info me-2"></i>
                        <label for="id_description" class="fw-bold text-dark mb-0">Описание</label>
                    </div>
                    <textarea name="description" id="id_description" class="form-control" rows="5">{{ task.description }}</textarea>
                </div>

                <div class="row g-3 mb-4">
                    <!-- Поле Статус -->
                    <div class="col-md-6">
                        <div class="card bg-light h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-tag fs-4 text-warning me-2"></i>
                                    <label for="id_status" class="fw-bold text-dark mb-0">Статус</label>
                                </div>
                                <select name="status" id="id_status" class="form-select" required>
                                    {% for status in form.fields.status.queryset %}
                                        <option value="{{ status.id }}" {% if task.status.id == status.id %}selected{% endif %}>
                                            {{ status.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Поле Исполнитель -->
                    <div class="col-md-6">
                        <div class="card bg-light h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-person-check fs-4 text-success me-2"></i>
                                    <label for="id_executor" class="fw-bold text-dark mb-0">Исполнитель</label>
                                </div>
                                <select name="executor" id="id_executor" class="form-select">
                                    <option value="">---------</option>
                                    {% for user in form.fields.executor.queryset %}
                                        <option value="{{ user.id }}" {% if task.executor and task.executor.id == user.id %}selected{% endif %}>
                                            {{ user.get_full_name|default:user.username }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Поле Метки (заглушка) -->
                <div class="mb-4 p-3 bg-light rounded">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-tags fs-4 text-info me-2"></i>
                        <label for="id_labels" class="fw-bold text-dark mb-0">Метки</label>
                    </div>
                    <select name="labels" id="id_labels" class="form-select" multiple disabled>
                        <option value="">Метки будут доступны в следующей версии</option>
                    </select>
                    <div class="form-text text-muted mt-1">
                        <i class="bi bi-info-circle"></i> Функционал меток будет добавлен позже
                    </div>
                </div>

                <!-- Кнопки действий -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-check-lg"></i> Сохранить
                    </button>
                    <a href="{% url 'tasks_index' %}" class="btn btn-secondary px-4 py-2">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
