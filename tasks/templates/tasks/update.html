{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-dark">
        <i class="bi bi-pencil-square"></i> Изменение задачи
    </h1>

    <div class="card shadow-sm border-secondary">
        <div class="card-header bg-primary text-white">
            <h2 class="card-title h4 mb-0">
                <i class="bi bi-list-check"></i> {{ task.name }}
            </h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-check-lg"></i> Сохранить
                    </button>
                    <a href="{% url 'tasks_index' %}" class="btn btn-secondary px-4 py-2">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
