{% extends 'base.html' %}

{% block content %}
<div class="container col-md-6 offset-md-3">
    <h1 class="my-4">Удаление задачи</h1>
    <p>Вы уверены, что хотите удалить задачу «{{ task.name }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'tasks_index' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
