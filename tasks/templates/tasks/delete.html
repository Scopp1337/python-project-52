{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-dark">
        <i class="bi bi-trash"></i> Удаление задачи
    </h1>

    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h2 class="card-title h4 mb-0">
                <i class="bi bi-exclamation-triangle-fill"></i> Подтверждение удаления
            </h2>
        </div>
        <div class="card-body">
            <p class="lead">Вы уверены, что хотите удалить задачу <strong>"{{ task.name }}"</strong>?</p>

            <form method="post">
                {% csrf_token %}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-danger px-4 py-2">
                        <i class="bi bi-check-lg"></i> Да, удалить
                    </button>
                    <a href="{% url 'tasks_index' %}" class="btn btn-secondary px-4 py-2">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
