{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container col-md-6 offset-md-3">
    <h1 class="my-4">Вход</h1>
    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="alert alert-danger mt-1">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
</div>
{% endblock %}
