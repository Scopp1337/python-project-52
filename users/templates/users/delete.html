{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container col-md-6 offset-md-3">
    <h1 class="my-4">Удаление пользователя</h1>
    <p>Вы уверены, что хотите удалить {{ user.first_name }} {{ user.last_name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'users_index' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
