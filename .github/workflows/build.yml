name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: make ci-install

      - name: Run migrations
        run: make ci-migrate

      - name: Run tests with coverage
        run: make ci-test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@e43e794c3422b3fc6340c9f43eeb95cd53d0c0e3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Scopp1337_python-project-52
            -Dsonar.organization=scopp1337
            -Dsonar.python.coverage.reportPaths=coverage.xml