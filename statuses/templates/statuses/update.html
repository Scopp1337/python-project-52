{% extends 'base.html' %}

{% block content %}
<div class="container col-md-6 offset-md-3">
    <h1 class="my-4">Изменение статуса</h1>
    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_name" class="form-label">Имя</label>
            <input type="text" name="name" id="id_name" class="form-control" value="{{ form.name.value|default:status.name }}" required>

            {% if form.name.errors %}
                <div class="alert alert-danger mt-1">
                    {% for error in form.name.errors %}
                        {{ error }}
                    {% endfor %}
                </div>
            {% endif %}
        </div>

        <button type="submit" class="btn btn-primary">Изменить</button>
    </form>
</div>
{% endblock %}
