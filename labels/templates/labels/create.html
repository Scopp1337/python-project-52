{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-dark">
        <i class="bi bi-plus-circle"></i> Создание метки
    </h1>

    <div class="card shadow-sm border-secondary">
        <div class="card-header bg-success text-white">
            <h2 class="card-title h4 mb-0">
                <i class="bi bi-tag-fill"></i> Новая метка
            </h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="mb-4 p-3 bg-light rounded">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-pencil-square fs-4 text-primary me-2"></i>
                        <label for="id_name" class="fw-bold text-dark mb-0">Имя</label>
                    </div>
                    <input type="text" name="name" id="id_name" class="form-control" required>
                    {% if form.name.errors %}
                        <div class="text-danger mt-2">
                            {% for error in form.name.errors %}
                                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-check-lg"></i> Создать
                    </button>
                    <a href="{% url 'labels_index' %}" class="btn btn-secondary px-4 py-2">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
